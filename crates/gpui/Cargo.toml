[package]
name = "player-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "A Video.js-style video player component for GPUI apps, built on player-rs."
readme = "../../README.md"
keywords = ["mpv", "video", "player", "gpui"]
categories = ["multimedia::video", "gui"]

[lib]
name = "player_gpui"

[dependencies]
player-rs = { path = "../player", version = "26.10.0" }
# GPUI itself, through GPUI-Kit. Without default features this is GPUI and its platform only; the app's own `gpui-kit`
# features (components, assets, `gpui-fast`) unify with it, so the element follows the backend the app picked.
gpui-kit = { version = "0.8", default-features = false }

# The video element's frame subscription and its error logging (GPUI's own logging facade). Video is macOS-only.
[target.'cfg(target_os = "macos")'.dependencies]
flume = "0.12"
log = "0.4"

[dev-dependencies]
# Headless windows for the element's tests.
gpui-kit = { version = "0.8", default-features = false, features = ["test-support"] }
