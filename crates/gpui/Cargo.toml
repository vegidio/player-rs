[package]
name = "player-gpui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "A Video.js-style video player component for GPUI apps, built on player-rs."
readme = "../../README.md"
keywords = ["mpv", "video", "player", "gpui"]
categories = ["multimedia::video", "gui"]

[lib]
name = "player_gpui"

[dependencies]
player-rs = { path = "../player", version = "26.10.0" }
# GPUI through GPUI-Kit, with its components (icons, tooltips, the spinner) and its Lucide icons. These are GPUI-Kit's
# default features, so apps already have them on; the app's own features (`gpui-fast` among them) unify with these, so
# the element follows the backend the app picked. 0.8.1 brings the `icon_assets!` macro.
gpui-kit = { version = "0.8.1", default-features = false, features = ["component", "assets"] }

# Logging of requests mpv rejects, and of video that cannot be shown: GPUI's own logging facade.
log = "0.4"

# The video element's frame subscription, on macOS, Windows and Linux. Windows and Linux video need GPUI patched with
# video surfaces (see the README's "Windows video" and "Linux video"); without the patch, the build fails with an error
# naming `WINDOWS_SURFACES_REQUIRE_PATCHED_GPUI` or `LINUX_SURFACES_REQUIRE_PATCHED_GPUI`.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
flume = "0.12"

# Inter's registration, checked on the platform's own text system, which macOS creates only on the main thread.
[[test]]
name = "fonts"
harness = false

[dev-dependencies]
# Headless windows for the element's tests.
gpui-kit = { version = "0.8.1", default-features = false, features = ["component", "assets", "test-support"] }
# RAII temporary directories for the WAV media of the control tests. A git dependency without a version is stripped by
# `cargo publish`, so the crate stays publishable.
rust-sak = { git = "https://github.com/vegidio/rust-sak", tag = "26.10.1", default-features = false, features = ["fs"] }

# The Windows video tests: a shared Direct3D 11 texture made by the test (the version GPUI and `player-rs` use), and
# GPUI's headless Direct3D renderer, which only the patched `gpui-pre-windows` has. Both are already in the graph.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
gpui-pre-windows = { version = "=0.3.10", features = ["test-support"] }

# The Linux video tests: GPUI's headless wgpu renderer, whose dma-buf import only the patched `gpui-pre-wgpu` has. It is
# already in the graph.
[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui-pre-wgpu = { version = "=0.3.10", features = ["test-support"] }
