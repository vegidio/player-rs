[package]
name = "player-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
links = "mpv"
build = "build.rs"
description = "Play any media mpv can play, via statically-linked libmpv."
readme = "../../README.md"
keywords = ["mpv", "video", "player", "media", "libmpv"]
categories = ["multimedia::video", "external-ffi-bindings"]

[lib]
name = "player"

# `build.rs` only downloads the prebuilt archive and emits link directives; the FFI
# bindings are pre-generated by `xtask` and committed (see src/sys/bindings.rs), so no
# bindgen/libclang is needed to consume this crate.
[build-dependencies]
ureq = "3.5"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dependencies]
thiserror = "2"
# The event channel: receivable from blocking threads and from any async executor alike.
flume = "0.12"

# `player::macos`: an offscreen CGL context and IOSurface-backed `CVPixelBuffer`s. The objc2 crates and versions are
# GPUI's own, so `CFRetained<CVPixelBuffer>` is the type its `paint_surface` takes.
[target.'cfg(target_os = "macos")'.dependencies]
glow = "0.16"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = [
    "std",
    "CVBase",
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
    "CVPixelBufferIOSurface",
    "CVReturn",
    "objc2-io-surface",
] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "objc2-core-foundation"] }

# `player::windows`: an offscreen WGL context drawing through `WGL_NV_DX_interop2` into D3D11 textures shared by NT
# handle. `windows` 0.62 is GPUI's own version, so GPUI apps build one copy.
[target.'cfg(windows)'.dependencies]
glow = "0.16"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

# `player::linux`: a surfaceless EGL context on a DRM device's GBM platform, drawing into dma-bufs. EGL and GBM are
# called through a small hand-written FFI; both are already linked through `mpv.pc`.
[target.'cfg(target_os = "linux")'.dependencies]
glow = "0.16"

[dev-dependencies]
# RAII temporary directories for the local-file tests. A git dependency without a version is stripped by
# `cargo publish`, so the crate stays publishable.
rust-sak = { git = "https://github.com/vegidio/rust-sak", tag = "26.10.1", default-features = false, features = ["fs"] }
# The render tests' offscreen framebuffer and pixel readback.
glow = "0.16"

# Headless GL contexts for the render tests: EGL on a device (Linux), WGL on a hidden window (Windows). macOS uses raw
# CGL instead, because glutin cannot select Apple's software renderer.
[target.'cfg(not(target_os = "macos"))'.dev-dependencies]
glutin = { version = "0.32", default-features = false, features = ["egl", "wgl"] }

[target.'cfg(windows)'.dev-dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }
