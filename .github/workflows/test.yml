name: Test

# Builds and tests the workspace across every OS/architecture the `binaries-mpv` release
# ships: macOS (x64 + arm64), Linux (x64 + arm64), Windows MSVC (x64 + arm64). Each leg
# downloads the matching static archive in `crates/player/build.rs`, links it, and runs the
# tests, including the one asserting the linked libmpv matches the committed bindings.
# `fail-fast: false` so one platform's failure doesn't hide the others.
#
# `xtask` is never built here: it only regenerates the bindings and drags in bindgen/libclang.
#
# Runs only when triggered manually: Actions tab -> Test -> "Run workflow", or
# `gh workflow run test.yml --ref <branch>`.

on:
  workflow_dispatch:

# Be resilient to flaky crates.io downloads on the runners.
env:
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  # The Linux archive leaves the display and audio stacks and the Vulkan loader dynamic. These
  # packages provide their `.pc` files and `.so` links for the closure of `mpv.pc`; `build.rs`
  # reads the `.pc` files itself, so no `pkg-config` binary is needed. GPUI (`crates/gpui`)
  # also needs xkbcommon-x11, fontconfig and freetype.
  LINUX_DEV_PACKAGES: >-
    libx11-dev libxext-dev libxfixes-dev libxrandr-dev libxss-dev libxpresent-dev
    libx11-xcb-dev libxcb-dri3-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev
    libgbm-dev libdrm-dev libxkbcommon-x11-dev libfontconfig-dev libfreetype-dev
    libdisplay-info-dev libvdpau-dev libpulse-dev libpipewire-0.3-dev libvulkan-dev
  # Software OpenGL and Vulkan for the render tests and `player-gpui`'s video tests: Mesa's EGL, llvmpipe, GBM and
  # lavapipe, from the kisak PPA (Mesa 26), whose lavapipe imports dma-bufs, unlike Ubuntu's Mesa 25. The runners have
  # no GPU.
  LINUX_GL_PACKAGES: libegl1 libegl-mesa0 libgl1-mesa-dri libgbm1 mesa-vulkan-drivers
  # Mesa's software OpenGL for Windows, from https://github.com/pal1000/mesa-dist-win (pinned, hash-checked).
  MESA_WIN_VERSION: "26.2.4"
  MESA_WIN_SHA256: 351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695

jobs:
  # fmt and clippy run once on Linux x64 (the lints are platform-independent), keeping the
  # per-platform matrix focused on building and running. `-D warnings` makes any lint fatal.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Linux dev packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ${{ env.LINUX_DEV_PACKAGES }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude xtask --all-targets -- -D warnings

      # Without the `[patch.crates-io]` lines, the first error names the marker the README points at.
      - name: Build error without the patched GPUI
        run: |
          sed -i '/^\[patch.crates-io\]/,/^$/{/^gpui-pre/d}' Cargo.toml
          if cargo check -p player-gpui --message-format short 2> check.log; then
            echo "player-gpui built without the patched GPUI" && exit 1
          fi
          first=$(grep -m1 ': error' check.log)
          echo "$first"
          [[ "$first" == *LINUX_SURFACES_REQUIRE_PATCHED_GPUI* ]]
          git checkout -- Cargo.toml Cargo.lock

  # `player-gpui`'s Windows video is Windows-only code, which the Linux lint never compiles.
  lint-windows:
    name: Lint (Windows video)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: lint-windows

      - name: Clippy
        run: cargo clippy -p player-gpui --all-targets -- -D warnings

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Apple-Silicon runner; the x64 leg cross-compiles and runs via Rosetta.
          - name: macOS arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - name: macOS x64
            runner: macos-latest
            target: x86_64-apple-darwin
            rosetta: true
          # Linux: native runners.
          - name: Linux x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          # Windows: stock MSVC targets. The archives ship no DLLs, so nothing is added to PATH.
          # Mesa has no WGL_NV_DX_interop2, so the Windows surface tests check only that building a renderer fails
          # with a clear error, and skip the rest; they run in full on a machine with a GPU driver.
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          # No software OpenGL exists for Windows arm64 (mesa-dist-win builds x64 and x86 only, and an arm64
          # process cannot load x64 DLLs); the runner offers only GDI's OpenGL 1.1. The GL tests, the surface tests
          # among them, are skipped there.
          - name: Windows arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            skip_gl: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta 2
        if: matrix.rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install Linux dev packages
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ env.LINUX_DEV_PACKAGES }} ${{ env.LINUX_GL_PACKAGES }}

      # A DRM device for the Linux surface tests (`tests/surface/linux.rs`): the kernel's virtual GEM driver, on which
      # Mesa's llvmpipe allocates dma-bufs through its card node. The runners' kernel ships it; the modules package is
      # only a fallback.
      - name: Load vgem (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo modprobe vgem || { sudo apt-get install -y "linux-modules-extra-$(uname -r)" && sudo modprobe vgem; }
          sudo chmod 666 /dev/dri/*
          ls -l /dev/dri

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build -p player-rs -p player-gpui --target ${{ matrix.target }} --all-targets

      # CI tests in debug, where GPUI compiles its shaders at run time; a release build compiles them with the Windows
      # SDK's `fxc.exe`, the fork's `surface` shader among them.
      - name: Build release example
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build --release -p player-gpui --target ${{ matrix.target }} --example play

      # The system's GDI OpenGL is version 1.1, which mpv cannot use. Mesa's `opengl32.dll` placed next to the test
      # binaries is loaded instead, since Windows searches the executable's folder first. Only the tests use it;
      # shipped apps keep importing the system's DLLs.
      - name: Install Mesa OpenGL (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          archive="mesa3d-${MESA_WIN_VERSION}-release-msvc.7z"
          curl -fsSL --retry 5 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/pal1000/mesa-dist-win/releases/download/${MESA_WIN_VERSION}/$archive"
          echo "${MESA_WIN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          7z e "$RUNNER_TEMP/$archive" x64/opengl32.dll x64/libgallium_wgl.dll -o"target/${{ matrix.target }}/debug/deps" -y

      - name: Test
        run: cargo test -p player-rs -p player-gpui --target ${{ matrix.target }}
        env:
          # Linux: Mesa's llvmpipe, also for the surface tests on vgem. Windows: Mesa's llvmpipe rather than its D3D12
          # driver. Ignored on macOS, where the tests ask CGL for Apple's software renderer.
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          PLAYER_TEST_SKIP_GL: ${{ matrix.skip_gl && '1' || '' }}
          # Linux: GPUI on lavapipe, which imports the video's dma-bufs into linear Vulkan images.
          VK_DRIVER_FILES: ${{ runner.os == 'Linux' && '/usr/share/vulkan/icd.d/lvp_icd.json' || '' }}

      # `player-gpui`'s video tests again with no Vulkan driver, so GPUI draws with OpenGL on llvmpipe and imports the
      # dma-bufs through EGL.
      - name: Test player-gpui on OpenGL (Linux)
        if: runner.os == 'Linux'
        run: cargo test -p player-gpui --target ${{ matrix.target }}
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          VK_DRIVER_FILES: /dev/null


      # Last, as it hides the DRM devices: on a machine without one, as WSL2 without `vgem`, the element stays black
      # with one warning and the player keeps playing.
      - name: Test player-gpui without a DRM device (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo mount -t tmpfs none /dev/dri
          cargo test -p player-gpui --target ${{ matrix.target }} -- warns_once_without_a_render_node
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
